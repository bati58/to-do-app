<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A focused, professional task manager">
  <title>Taskflow | Personal task manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --ink: #172033;
      --muted: #748099;
      --line: #e8ebf2;
      --primary: #635bff;
      --primary-dark: #4b44d5;
      --surface: #ffffff;
      --background: #f6f7fb;
      --danger: #e25563;
      --success: #2eae78;
      --shadow: 0 18px 50px rgba(37, 43, 74, .08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 0 0, #e6e5ff 0, transparent 34%), var(--background);
      font: 400 15px/1.5 "DM Sans", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      padding: 32px 20px;
      color: #fff;
      background: linear-gradient(160deg, #242044, #17162e);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin: 0 12px 55px; font: 700 22px "Space Grotesk", sans-serif; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: #201b55; background: #a9a4ff; }
    .nav-label { margin: 0 12px 10px; color: #9793b7; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border: 0; border-radius: 10px; color: #c9c6df; background: transparent; text-align: left; }
    .nav-item.active, .nav-item:hover { color: #fff; background: rgba(255,255,255,.1); }
    .main { width: min(1050px, 100%); margin: 0 auto; padding: 42px 38px 60px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    h1 { margin: 0 0 5px; font: 700 clamp(26px, 4vw, 36px) "Space Grotesk", sans-serif; letter-spacing: -.04em; }
    .subtitle { margin: 0; color: var(--muted); }
    .date-badge { padding: 10px 15px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.75); white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
    .stat-card { display: flex; align-items: center; gap: 14px; padding: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .stat-icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; color: var(--primary); background: #efefff; }
    .stat-card strong { display: block; font-size: 22px; }
    .stat-card span { color: var(--muted); font-size: 12px; }
    .task-card { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
    .task-form { display: grid; grid-template-columns: minmax(180px, 1fr) 130px 150px auto; gap: 10px; padding: 20px; border-bottom: 1px solid var(--line); }
    input, select { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fafbfe; outline: none; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #635bff18; }
    .primary-btn { padding: 0 18px; border: 0; border-radius: 9px; color: #fff; background: var(--primary); font-weight: 700; }
    .primary-btn:hover { background: var(--primary-dark); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; }
    .search-wrap { position: relative; flex: 1; min-width: 190px; }
    .search-wrap i { position: absolute; top: 13px; left: 13px; color: var(--muted); }
    .search-wrap input { padding-left: 37px; }
    .filters { display: flex; gap: 5px; padding: 4px; border-radius: 9px; background: #f2f3f8; }
    .filter-btn { padding: 7px 12px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; }
    .filter-btn.active { color: var(--ink); background: #fff; box-shadow: 0 2px 6px #2222; }
    .clear-btn { padding: 7px 0; border: 0; color: var(--danger); background: transparent; }
    #tasksList { display: grid; gap: 10px; margin: 0; padding: 0 20px 20px; list-style: none; }
    .task-item { display: flex; align-items: center; gap: 13px; padding: 15px; border: 1px solid var(--line); border-radius: 12px; transition: transform .2s, box-shadow .2s; }
    .task-item:hover { transform: translateY(-1px); box-shadow: 0 7px 18px #252b4a0d; }
    .check-btn { display: grid; flex: 0 0 auto; place-items: center; width: 22px; height: 22px; border: 2px solid #cdd2df; border-radius: 50%; color: #fff; background: transparent; }
    .task-item.completed .check-btn { border-color: var(--success); background: var(--success); }
    .task-content { min-width: 0; flex: 1; }
    .task-title { display: block; overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .task-item.completed .task-title { color: var(--muted); text-decoration: line-through; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .priority { padding: 2px 7px; border-radius: 20px; font-weight: 700; }
    .priority-high { color: #be4351; background: #fff0f1; }
    .priority-medium { color: #ae7511; background: #fff8e6; }
    .priority-low { color: #27835e; background: #eafaf2; }
    .task-actions { display: flex; gap: 5px; }
    .icon-btn { width: 32px; height: 32px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; }
    .icon-btn:hover { color: var(--primary); background: #f0efff; }
    .icon-btn.delete:hover { color: var(--danger); background: #fff0f1; }
    .empty-state { padding: 42px 20px 48px; color: var(--muted); text-align: center; }
    .empty-state i { margin-bottom: 12px; color: #c7c9ed; font-size: 38px; }
    .empty-state p { margin: 0; }
    .toast { position: fixed; right: 24px; bottom: 24px; padding: 12px 17px; border-radius: 9px; color: #fff; background: #20233a; box-shadow: var(--shadow); transform: translateY(20px); opacity: 0; pointer-events: none; transition: .25s; }
    .toast.show { transform: translateY(0); opacity: 1; }
    @media (max-width: 760px) {
      .app-shell { display: block; }
      .sidebar { padding: 16px; }
      .brand { margin: 0; }
      .nav-label, .nav-item { display: none; }
      .main { padding: 28px 16px 45px; }
      .topbar { display: block; }
      .date-badge { display: inline-block; margin-top: 15px; }
      .stats { gap: 8px; }
      .stat-card { display: block; padding: 12px; text-align: center; }
      .stat-icon { margin: 0 auto 6px; }
      .task-form { grid-template-columns: 1fr 1fr; }
      .task-form input:first-child { grid-column: 1 / -1; }
      .primary-btn { min-height: 42px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark"><i class="fa-solid fa-check"></i></span> taskflow</div>
      <p class="nav-label">Workspace</p>
      <button class="nav-item active"><i class="fa-solid fa-list-check"></i> All tasks</button>
      <button class="nav-item"><i class="fa-regular fa-star"></i> Important</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><h1>Good morning, let's focus.</h1><p class="subtitle">Keep your day clear and your goals closer.</p></div>
        <div class="date-badge"><i class="fa-regular fa-calendar"></i> <span id="currentDate"></span></div>
      </header>
      <section class="stats" aria-label="Task summary">
        <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-layer-group"></i></div><div><strong id="totalCount">0</strong><span>Total tasks</span></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-spinner"></i></div><div><strong id="activeCount">0</strong><span>In progress</span></div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div><div><strong id="completedCount">0</strong><span>Completed</span></div></div>
      </section>
      <section class="task-card">
        <form class="task-form" id="taskForm">
          <input id="taskInput" type="text" maxlength="120" placeholder="What needs to be done?" aria-label="Task title" required>
          <select id="priorityInput" aria-label="Task priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select>
          <input id="dueDateInput" type="date" aria-label="Due date">
          <button class="primary-btn" type="submit"><i class="fa-solid fa-plus"></i> Add task</button>
        </form>
        <div class="toolbar">
          <div class="search-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="search" placeholder="Search tasks..." aria-label="Search tasks"></div>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-btn active" data-filter="all">All</button><button class="filter-btn" data-filter="active">Active</button><button class="filter-btn" data-filter="completed">Done</button>
          </div>
          <button id="clearCompleted" class="clear-btn" type="button">Clear completed</button>
        </div>
        <ul id="tasksList"></ul>
        <div id="emptyState" class="empty-state"><i class="fa-solid fa-wand-magic-sparkles"></i><p>No tasks here yet. Add one above to get started.</p></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
